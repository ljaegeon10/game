<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Well Below Pistol</title>
<style>
  /* 어두운 실험실 한 가지 모습만 갖는 시연 화면 */
  :root { color-scheme: dark; --void: #05070a; --teal: #00ffd5; --dim: #4f6a66; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--void); color: #cfe9e3;
    display: grid; place-items: center;
    padding: 16px; box-sizing: border-box; overflow-x: hidden;
    font-family: 'DungGeunMo', ui-monospace, Menlo, Consolas, monospace;
  }
  #wrap { width: min(100%, calc((100vh - 64px) * 960 / 764)); }
  canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; background: #000; }
  p { margin: 10px 0 0; font-size: 12px; color: var(--dim); text-align: center; letter-spacing: .06em; line-height: 1.7; }
  kbd { color: var(--teal); font: inherit; border: 1px solid #1d3a35; padding: 0 5px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="960" height="764" aria-label="1인칭 픽셀 피스톨 장전 모션"></canvas>
  <p><kbd>R</kbd> 장전 &nbsp; <kbd>SPACE</kbd> 일시정지 &nbsp; <kbd>← →</kbd> 한 장씩 (정지 중) &nbsp; <kbd>S</kbd> 시트 전체 보기 &nbsp; · 화면을 누르면 소리가 켜집니다</p>
</div>

<script src="../js/pistol.js"></script>
<script>
'use strict';
(() => {
/* ═══════════════════════════════════════════════════════════════
   <우물 아래> — 1인칭 픽셀 피스톨 · 장전 모션 시트

   시트 구조 (한 칸 128×96)
            col 0        col 1          col 2          col 3
     row0   IDLE ★       배출 준비       탄창 아래       손이 슬라이드에
     row1   숨 (위)      버튼 누름       밀어 넣는 중 ★  당기기 시작
     row2   숨 (위)      탄창 빠짐 ★     거의 다         끝까지 — 챔버 열림 ★
     row3   숨           빈 손잡이       철컥 (손바닥)   놓음 — 제자리로
     row4   [낙하 탄창 · 탄피 — 낱개 스프라이트]
     ★ = 하단 4×1 시트에 보여 주는 대표 프레임
   ═══════════════════════════════════════════════════════════════ */
const CW = 960, CH = 764;
const VW = 192, VH = 108, VS = 5;          // 장면 버퍼 — ×5 로 키워 960×540
const { FW, FH, COLS, SUBS, KEY, LABEL, SEQ, LIFT, SPR_MAG, SPR_CASE, C, OBANG, gx0 } = window.PistolArt;
const STEP = 1000 / 60;
const FONT = "'DungGeunMo', ui-monospace, Menlo, Consolas, monospace";

/* ═════════════ 실험실 배경 ═══════════════════════════════════ */
function bakeBackground() {
  const cv = document.createElement('canvas'); cv.width = VW; cv.height = VH;
  const c = cv.getContext('2d');
  const R = (col, x, y, w, h) => { c.fillStyle = col; c.fillRect(x, y, w, h); };
  const wg = c.createLinearGradient(0, 0, 0, 90);
  wg.addColorStop(0, '#0b0f15'); wg.addColorStop(1, '#141b25');
  c.fillStyle = wg; c.fillRect(0, 0, VW, 90);
  for (let x = 11; x < VW; x += 28) R('#090c11', x, 19, 1, 71);                    // 벽판 이음매
  R('#1d2632', 0, 67, VW, 2); R('#0a0d12', 0, 69, VW, 1);                          // 허리 몰딩
  // 천장 배관 — 위쪽 두 줄, 고정쇠
  [[6, 4], [13, 3]].forEach(([y, h]) => { R('#273140', 0, y, VW, h); R('#3a4656', 0, y, VW, 1); R('#0d1117', 0, y + h, VW, 1); });
  for (let x = 5; x < VW; x += 32) { R('#151b24', x, 5, 3, 13); R('#4a5666', x, 5, 3, 1); }
  // 세로 배관 + 붉은 밸브
  R('#222b37', 15, 17, 5, 73); R('#384454', 15, 17, 1, 73); R('#0d1117', 19, 17, 1, 73);
  R('#c2352c', 12, 41, 11, 2); R('#c2352c', 16, 36, 2, 12); R('#7d1b20', 12, 42, 11, 1);
  R('#273140', 20, 56, 30, 3); R('#3a4656', 20, 56, 30, 1);
  // 왼쪽 모니터 (심전도는 매 프레임 그림)
  R('#1b222c', 26, 24, 36, 24); R('#03110e', 28, 26, 32, 19); R('#0a1d19', 28, 26, 32, 1);
  R('#1b222c', 41, 48, 6, 5); R('#262e39', 36, 52, 16, 2);
  // 오른쪽 큰 화면 — 데이터 막대
  R('#1b222c', 128, 20, 44, 30); R('#040c0b', 130, 22, 40, 26);
  // 오른쪽 기계 장치 — 통풍구, 경고 띠
  R('#1a212b', 158, 53, 34, 37); R('#2a3442', 158, 53, 34, 1); R('#0c1016', 159, 54, 1, 36);
  for (let y = 58; y < 80; y += 3) R('#0e1319', 163, y, 24, 1);
  for (let i = 0; i < 7; i++) R(i % 2 ? '#e3b23c' : '#15141b', 158 + i * 5, 85, 5, 3);
  // 바닥 — 멀수록 촘촘한 격자
  R('#0a0d12', 0, 90, VW, VH - 90);
  for (let i = 0, y = 91; y < VH; i++, y += 2 + i) R('#151c25', 0, y, VW, 1);
  for (let x = -160; x < VW + 160; x += 20) {
    c.strokeStyle = 'rgba(32,42,54,.8)'; c.lineWidth = 1; c.beginPath();
    c.moveTo(VW / 2 + (x - VW / 2) * .35, 90); c.lineTo(x, VH); c.stroke();
  }
  // 천장 조명의 찬 빛 웅덩이
  const lg = c.createRadialGradient(VW / 2, 0, 4, VW / 2, 24, 120);
  lg.addColorStop(0, 'rgba(200,225,255,.12)'); lg.addColorStop(1, 'rgba(200,225,255,0)');
  c.fillStyle = lg; c.fillRect(0, 0, VW, VH);
  return cv;
}

/* 주사선 + 가장자리 어둡게 (화면 크기로 한 번만) */
function bakeOverlay() {
  const cv = document.createElement('canvas'); cv.width = CW; cv.height = VH * VS;
  const c = cv.getContext('2d');
  const g = c.createRadialGradient(CW / 2, 270, 180, CW / 2, 270, 620);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.65)');
  c.fillStyle = g; c.fillRect(0, 0, CW, cv.height);
  c.fillStyle = 'rgba(0,0,0,.16)';
  for (let y = 0; y < cv.height; y += VS) c.fillRect(0, y, CW, 1);
  return cv;
}

/* ═════════════ 소리 (아주 짧은 합성음) ════════════════════════ */
const Sfx = {
  ac: null,
  on() { if (!this.ac) { try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } } if (this.ac.state === 'suspended') this.ac.resume(); },
  hit(f, dur, vol, type = 'square', slide) {
    const a = this.ac; if (!a || a.state !== 'running') return;
    const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
  },
  noise(dur, vol, hp) {
    const a = this.ac; if (!a || a.state !== 'running') return;
    const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; f.type = 'highpass'; f.frequency.value = hp; g.gain.value = vol;
    s.connect(f).connect(g).connect(a.destination); s.start();
  },
  press() { this.hit(1800, .03, .06); },
  drop()  { this.noise(.08, .12, 1500); this.hit(300, .06, .05, 'triangle'); },
  clank() { this.noise(.12, .18, 900); this.hit(180, .1, .08, 'square', 90); },
  seat()  { this.noise(.05, .2, 2500); this.hit(520, .05, .09); },
  rack()  { this.noise(.07, .16, 2000); this.hit(900, .04, .06, 'square', 600); },
  snap()  { this.noise(.05, .22, 3000); this.hit(1200, .04, .08); },
  tink()  { this.hit(3200, .05, .04, 'triangle'); }
};

/* ═════════════ 파티클 — 미리 만든 풀을 돌려 씁니다 ═══════════════ */
const POOL = 192;
const parts = Array.from({ length: POOL }, () => ({ on: false, x: 0, y: 0, vx: 0, vy: 0, g: 0, life: 0, max: 1, c: '#fff', glow: false, floor: false }));
let partI = 0;
function emit(x, y, vx, vy, c, life, g = .12, glow = false, floor = true) {
  const p = parts[partI]; partI = (partI + 1) % POOL;
  p.on = true; p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.c = c; p.life = p.max = life; p.g = g; p.glow = glow; p.floor = floor;
}
const FLOOR_Y = VH - 6;
function tickParts() {
  for (const p of parts) {
    if (!p.on) continue;
    p.vy += p.g; p.x += p.vx; p.y += p.vy;
    if (p.floor && p.y > FLOOR_Y) { p.y = FLOOR_Y; p.vy *= -.35; p.vx *= .6; }
    if (--p.life <= 0) p.on = false;
  }
}

/* ═════════════ 애니메이션 ═══════════════════════════════════
   [단계, 장, 길이(프레임), 이벤트] — 이벤트는 그 장이 시작되는 순간 일어납니다 */
const IDLE_SUB = 18, IDLE_HOLD = 200;
const st = {
  mode: 'idle', t: 0, seq: 0, seqT: 0, idleT: 0,
  col: 0, row: 0, dy: 0, kick: 0, kx: 0, paused: false, showSheet: false,
  mags: [], cases: [], frame: 0
};
const GUN_X = (VW - FW) / 2 | 0, GUN_Y = VH - FH;
const SY = -LIFT;                                    // 옆모습 칸의 세로 보정

function startReload() { if (st.mode === 'reload') return; st.mode = 'reload'; st.seq = 0; st.seqT = 0; fireEvent(SEQ[0][3]); }

function fireEvent(ev) {
  const gx = GUN_X + st.kx, gy = GUN_Y + st.dy + st.kick + SY;
  switch (ev) {
    case 'cant': st.dy = 16; break;                          // 총을 옆으로 눕히며 내려옵니다
    case 'press': Sfx.press(); for (let i = 0; i < 4; i++) emit(gx + 67, gy + 49, (Math.random() - .5) * .6, -.4 - Math.random() * .4, C.T, 14, 0, true, false); break;
    case 'release': Sfx.drop(); break;
    case 'drop':                                              // 빈 탄창이 떨어져 나갑니다
      st.mags.push({ x: gx + gx0(82) - 2, y: gy + 49 + 15, vx: -.25 + Math.random() * .2, vy: .6, tilt: 0, dead: false });
      break;
    case 'bring': Sfx.tink(); break;
    case 'seat':                                              // 철컥 — 손바닥으로 밀어 넣음
      Sfx.seat(); st.kick = -3;
      for (let i = 0; i < 8; i++) emit(gx + gx0(82) + 4 + Math.random() * 10, gy + 84, (Math.random() - .5) * 1.4, -Math.random() * 1.2, i % 3 ? C.G5 : C.T, 18, .08, i % 3 === 0);
      break;
    case 'grab': Sfx.tink(); break;
    case 'pull': Sfx.rack(); break;
    case 'eject':                                             // 챔버의 탄이 튀어나갑니다
      st.cases.push({ x: gx + 64, y: gy + 29, vx: 1.2 + Math.random() * .5, vy: -2.4, f: 0, dead: false });
      break;
    case 'snap':                                              // 놓으면 제자리로 — 톱니 빛이 뒤로 흘러갑니다
      Sfx.snap(); st.kick = 2;
      for (let i = 0; i < 18; i++) emit(gx + 78 + Math.random() * 12, gy + 30 + Math.random() * 10, 1.6 + Math.random() * 1.8, (Math.random() - .5) * .3, C.T, 14 + (Math.random() * 8 | 0), 0, true, false);
      break;
  }
}

function update() {
  st.frame++;
  tickParts();
  // 낙하 탄창 — 바닥에 부딪히면 오방색 파편으로
  for (const m of st.mags) {
    if (m.dead) continue;
    m.vy += .22; m.x += m.vx; m.y += m.vy; m.tilt += .04;
    if (m.y + SPR_MAG[3] - 6 > FLOOR_Y) {
      m.dead = true; Sfx.clank();
      const cx = m.x + 12, cy = FLOOR_Y - 2;
      for (let i = 0; i < 26; i++) {
        const a = -Math.PI * (.1 + Math.random() * .8), sp = .6 + Math.random() * 2.2;
        emit(cx + (Math.random() - .5) * 10, cy, Math.cos(a) * sp, Math.sin(a) * sp, i < 20 ? OBANG[i % 5] : C.G4, 30 + (Math.random() * 30 | 0), .12);
      }
      for (let i = 0; i < 6; i++) emit(cx, cy, (Math.random() - .5) * 2.6, -Math.random() * 2, C.T, 16, .06, true);
    }
  }
  st.mags = st.mags.filter(m => !m.dead);
  for (const c of st.cases) {
    if (c.dead) continue;
    c.vy += .16; c.x += c.vx; c.y += c.vy; c.f++;
    if (c.y > FLOOR_Y - 2 && c.vy > 0) {
      if (Math.abs(c.vy) < 1) c.dead = true; else { c.vy *= -.4; c.vx *= .6; Sfx.tink(); }
    }
    if (c.x > VW + 10) c.dead = true;
  }
  st.cases = st.cases.filter(c => !c.dead);
  // 흔들림 · 오프셋은 천천히 제자리로
  st.dy *= .82; if (Math.abs(st.dy) < .3) st.dy = 0;
  st.kick *= .7; if (Math.abs(st.kick) < .3) st.kick = 0;
  if (st.paused) return;

  if (st.mode === 'idle') {
    st.idleT++;
    st.col = 0; st.row = Math.floor(st.idleT / IDLE_SUB) % SUBS;
    st.kx = Math.round(Math.sin(st.idleT * .02) * 1.2);
    if (st.idleT >= IDLE_HOLD) { st.idleT = 0; startReload(); }
    return;
  }
  // 장전 — 시퀀스를 한 장씩
  const [col, row, dur] = SEQ[st.seq];
  st.col = col; st.row = row; st.kx = 0;
  // 슬라이드를 당기는 동안 톱니 빛이 계속 흘러나옵니다
  if (col === 3 && (row === 1 || row === 2) && st.frame % 2 === 0)
    emit(GUN_X + 82 + Math.random() * 10, GUN_Y + SY + st.dy + 30 + Math.random() * 10, 1.2 + Math.random(), 0, C.T, 10, 0, true, false);
  if (++st.seqT >= dur) {
    st.seqT = 0; st.seq++;
    if (st.seq >= SEQ.length) { st.mode = 'idle'; st.idleT = 0; st.dy = 14; return; }   // 다시 들어 올림
    fireEvent(SEQ[st.seq][3]);
  }
}

/* ═════════════ 그리기 ═══════════════════════════════════════ */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const scene = document.createElement('canvas'); scene.width = VW; scene.height = VH;
const sc = scene.getContext('2d');
const gbuf = document.createElement('canvas'); gbuf.width = VW; gbuf.height = VH;
const gc = gbuf.getContext('2d');
const gsmall = document.createElement('canvas'); gsmall.width = VW / 4; gsmall.height = VH / 4;
const gs = gsmall.getContext('2d');
const { sheet, mask } = window.PistolArt.bake();
const bg = bakeBackground(), overlay = bakeOverlay();

function drawDynamicBg() {
  const f = st.frame;
  // 왼쪽 모니터 — 심전도
  sc.save(); sc.beginPath(); sc.rect(28, 26, 32, 19); sc.clip();
  const head = (f * .5) % 32;
  for (let i = 0; i < 32; i++) {
    const x = 28 + i, ph = i % 32;
    let y = 36;
    const k = (ph % 16);
    if (k === 6) y = 33; else if (k === 7) y = 29; else if (k === 8) y = 41; else if (k === 9) y = 35;
    const age = (head - i + 32) % 32;
    sc.fillStyle = `rgba(0,255,213,${Math.max(0, 1 - age / 28)})`; sc.fillRect(x, y, 1, 1);
    gc.fillStyle = sc.fillStyle; gc.fillRect(x, y, 1, 1);
  }
  sc.restore();
  // 오른쪽 화면 — 막대가 오르내리고 글자처럼 깜빡임
  for (let i = 0; i < 8; i++) {
    const h = 4 + Math.round((Math.sin(f * .03 + i * 1.7) * .5 + .5) * 14);
    const hh = Math.round(h * .8);
    sc.fillStyle = i === 5 ? '#e3b23c' : '#00b89a'; sc.fillRect(132 + i * 5, 46 - hh, 3, hh);
  }
  for (let r = 0; r < 3; r++) for (let i = 0; i < 9; i++)
    if (((i * 7 + r * 13 + (f >> 4)) % 5) > 1) { sc.fillStyle = '#0d5a4f'; sc.fillRect(132 + i * 4, 24 + r * 3, 3, 1); }
  // 기계 장치 표시등
  [['#c2352c', 162, 56, 37], ['#e3b23c', 167, 56, 53], ['#00ffd5', 172, 56, 29]].forEach(([c, x, y, per]) => {
    if (Math.floor(f / per) % 2) { sc.fillStyle = c; sc.fillRect(x, y, 2, 2); gc.fillStyle = c; gc.fillRect(x, y, 2, 2); }
  });
}

function drawScene() {
  sc.clearRect(0, 0, VW, VH);
  gc.clearRect(0, 0, VW, VH);
  sc.imageSmoothingEnabled = false; gc.imageSmoothingEnabled = false;
  sc.drawImage(bg, 0, 0);
  drawDynamicBg();
  // 총 — 시트에서 한 칸을 잘라 찍습니다 (sx, sy)
  const sx = st.col * FW, sy = st.row * FH;
  const dx = GUN_X + st.kx, dy = GUN_Y + Math.round(st.dy + st.kick);
  sc.drawImage(sheet, sx, sy, FW, FH, dx, dy, FW, FH);
  gc.drawImage(mask, sx, sy, FW, FH, dx, dy, FW, FH);
  // 떨어지는 탄창 · 탄피 — 같은 시트의 낱개 칸에서
  for (const m of st.mags) sc.drawImage(sheet, ...SPR_MAG, Math.round(m.x), Math.round(m.y), SPR_MAG[2], SPR_MAG[3]);
  for (const c of st.cases) { const s = SPR_CASE[(c.f >> 2) % 2]; sc.drawImage(sheet, ...s, Math.round(c.x), Math.round(c.y), s[2], s[3]); }
  // 파티클
  for (const p of parts) {
    if (!p.on) continue;
    const a = Math.min(1, p.life / (p.max * .5));
    sc.globalAlpha = a; sc.fillStyle = p.c; sc.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
    if (p.glow) { gc.globalAlpha = a; gc.fillStyle = p.c; gc.fillRect(Math.round(p.x), Math.round(p.y), 1, 1); }
  }
  sc.globalAlpha = 1; gc.globalAlpha = 1;
}

function drawStrip() {
  const top = VH * VS;
  ctx.fillStyle = '#06080b'; ctx.fillRect(0, top, CW, CH - top);
  ctx.fillStyle = '#0f1a18'; ctx.fillRect(0, top, CW, 1);
  ctx.font = `12px ${FONT}`; ctx.textBaseline = 'top';
  ctx.fillStyle = '#3f5c57'; ctx.textAlign = 'left';
  ctx.fillText('SPRITE SHEET · 4×1 KEY FRAMES', 24, top + 8);
  ctx.textAlign = 'right';
  ctx.fillText(`col ${st.col} · row ${st.row}  →  sx ${st.col * FW}, sy ${st.row * FH}`, CW - 24, top + 8);
  const s = 1.5, w = FW * s, h = FH * s, gap = 24, x0 = (CW - (w * 4 + gap * 3)) / 2, y0 = top + 26;
  ctx.imageSmoothingEnabled = false;
  for (let c = 0; c < COLS; c++) {
    const x = x0 + c * (w + gap), on = st.col === c;
    ctx.fillStyle = '#0b1016'; ctx.fillRect(x, y0, w, h);
    ctx.drawImage(bg, (VW - FW) / 2, VH - FH, FW, FH, x, y0, w, h);      // 같은 실험실을 배경으로 (칸 크기만큼)
    ctx.fillStyle = 'rgba(4,6,9,.55)'; ctx.fillRect(x, y0, w, h);
    ctx.drawImage(sheet, c * FW, KEY[c] * FH, FW, FH, x, y0, w, h);
    ctx.strokeStyle = on ? '#00ffd5' : '#1b2a2c'; ctx.lineWidth = on ? 2 : 1;
    ctx.strokeRect(x + .5, y0 + .5, w - 1, h - 1);
    if (on) { ctx.shadowColor = '#00ffd5'; ctx.shadowBlur = 12; ctx.strokeRect(x + .5, y0 + .5, w - 1, h - 1); ctx.shadowBlur = 0; }
    const [n, en, ko] = LABEL[c];
    ctx.textAlign = 'left';
    ctx.fillStyle = on ? '#00ffd5' : '#5d7a75'; ctx.font = `12px ${FONT}`;
    ctx.fillText(`${n} ${en}`, x, y0 + h + 6);
    ctx.fillStyle = on ? '#cfe9e3' : '#3f5753';
    ctx.fillText(ko, x, y0 + h + 22);
    // 이 단계 안의 네 장 — 지금 장에 불
    for (let r = 0; r < SUBS; r++) {
      ctx.fillStyle = on && st.row === r ? '#00ffd5' : (r === KEY[c] ? '#3d6b64' : '#1c2a2a');
      ctx.fillRect(x + w - 4 * 10 + r * 10, y0 + h + 8, 7, 7);
    }
  }
}

function drawSheetOverlay() {
  ctx.fillStyle = 'rgba(2,4,6,.86)'; ctx.fillRect(0, 0, CW, VH * VS);
  const s = 1.05, w = sheet.width * s, h = sheet.height * s, x = (CW - w) / 2, y = (VH * VS - h) / 2;
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#0d1318'; ctx.fillRect(x, y, w, h);
  ctx.drawImage(sheet, x, y, w, h);
  ctx.strokeStyle = 'rgba(0,255,213,.18)'; ctx.lineWidth = 1;
  for (let c = 0; c <= COLS; c++) { ctx.beginPath(); ctx.moveTo(x + c * FW * s + .5, y); ctx.lineTo(x + c * FW * s + .5, y + h); ctx.stroke(); }
  for (let r = 0; r <= SUBS + 1; r++) { ctx.beginPath(); ctx.moveTo(x, y + r * FH * s + .5); ctx.lineTo(x + w, y + r * FH * s + .5); ctx.stroke(); }
  ctx.strokeStyle = '#00ffd5'; ctx.lineWidth = 2;
  ctx.strokeRect(x + st.col * FW * s, y + st.row * FH * s, FW * s, FH * s);
}

function draw() {
  drawScene();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(scene, 0, 0, VW * VS, VH * VS);
  // 글로우 — 마스크를 1/4 로 줄였다가 부드럽게 키워 두 번 겹칩니다
  gs.clearRect(0, 0, gsmall.width, gsmall.height);
  gs.imageSmoothingEnabled = true; gs.drawImage(gbuf, 0, 0, gsmall.width, gsmall.height);
  ctx.globalCompositeOperation = 'lighter';
  ctx.imageSmoothingEnabled = true;
  const pulse = .75 + .25 * Math.sin(st.frame * .08);
  ctx.globalAlpha = .9 * pulse; ctx.drawImage(gsmall, 0, 0, VW * VS, VH * VS);
  ctx.globalAlpha = .55; ctx.drawImage(gbuf, -2, -2, VW * VS + 4, VH * VS + 4);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(overlay, 0, 0);
  // 상태 표시
  ctx.font = `13px ${FONT}`; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(0,255,213,.75)';
  ctx.fillText(st.mode === 'idle' ? '● IDLE' : `● RELOAD  ${LABEL[st.col][1]}`, 20, 18);
  ctx.fillStyle = 'rgba(207,233,227,.4)';
  ctx.fillText('SUBJECT 07 · SIDEARM / THE WELL BELOW', 20, 36);
  if (st.paused) { ctx.textAlign = 'right'; ctx.fillStyle = '#e3b23c'; ctx.fillText('❚❚ PAUSED', CW - 20, 18); }
  if (st.showSheet) drawSheetOverlay();
  drawStrip();
}

/* ═════════════ 루프 · 입력 ═══════════════════════════════════ */
let acc = 0, last = performance.now();
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  draw();
  requestAnimationFrame(loop);
}

/* 정지 중 한 장씩 — 전체 순서 (IDLE 네 장 + 장전 열두 장) */
const ALL = [[0, 0], [0, 1], [0, 2], [0, 3], ...SEQ.map(([c, r]) => [c, r])];
function stepFrame(d) {
  let i = ALL.findIndex(([c, r]) => c === st.col && r === st.row);
  i = (i + d + ALL.length) % ALL.length;
  [st.col, st.row] = ALL[i];
  st.mode = st.col === 0 ? 'idle' : 'reload';
  if (st.mode === 'reload') { st.seq = Math.max(0, i - 4); st.seqT = 0; }
}

addEventListener('keydown', e => {
  Sfx.on();
  if (e.code === 'KeyR') startReload();
  else if (e.code === 'Space') { e.preventDefault(); st.paused = !st.paused; }
  else if (e.code === 'KeyS') st.showSheet = !st.showSheet;
  else if (st.paused && (e.code === 'ArrowRight' || e.code === 'ArrowLeft')) { e.preventDefault(); stepFrame(e.code === 'ArrowRight' ? 1 : -1); }
});
cv.addEventListener('pointerdown', () => { Sfx.on(); if (!st.paused) startReload(); });

const begin = () => requestAnimationFrame(t => { last = t; requestAnimationFrame(loop); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(begin, begin); else begin();
window.__pistol = { st, sheet, mask, startReload };     // 확인용
})();
</script>
